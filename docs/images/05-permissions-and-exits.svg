<svg baseProfile="full" height="900px" version="1.1" viewBox="0 0 1600 900" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><pattern height="80" id="grid" patternUnits="userSpaceOnUse" width="80"><path d="M80 0 H0 V80" fill="none" stroke="#172b3c" stroke-width="1" /></pattern></defs><rect fill="#081423" height="900px" width="1600px" x="0" y="0" /><rect fill="url(#grid)" height="900" opacity="0.52" width="1600" x="0" y="0" /><line stroke="#55e1de" stroke-width="5" x1="80" x2="300" y1="85" y2="85" /><text fill="#55e1de" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4" text-anchor="start" x="80" y="65">PASEO ENGINEERING / FIELD NOTES</text><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start" x="80" y="165">Three separate decisions</text><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" x="80" y="220">Issue label ≠ agent permission ≠ permission to merge.</text><line stroke="#2c4b63" stroke-width="2" x1="80" x2="1520" y1="818" y2="818" /><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="1.2" text-anchor="start" x="80" y="855">CONCEPTUAL DIAGRAM  ·  NOT A PASEO PRODUCT SCREENSHOT</text><text fill="#55e1de" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" x="1490" y="855">05-permissions-and-exits</text><rect fill="#12283e" height="270" rx="22" ry="22" stroke="#55e1de" stroke-width="2" width="407" x="87" y="326" /><text fill="#55e1de" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" x="121" y="380">01</text><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="37" font-weight="800" text-anchor="start" x="121" y="439">INTAKE</text><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start" x="121" y="494">label + author + boundary</text><line stroke="#55e1de" stroke-linecap="round" stroke-width="4" x1="502" x2="584" y1="455" y2="455" /><polygon fill="#55e1de" points="584,455 566,445 566,465" /><rect fill="#12283e" height="270" rx="22" ry="22" stroke="#ffc36e" stroke-width="2" width="407" x="596" y="326" /><text fill="#ffc36e" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" x="630" y="380">02</text><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="37" font-weight="800" text-anchor="start" x="630" y="439">EXECUTION</text><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start" x="630" y="494">provider mode + scope</text><line stroke="#ffc36e" stroke-linecap="round" stroke-width="4" x1="1011" x2="1093" y1="455" y2="455" /><polygon fill="#ffc36e" points="1093,455 1075,445 1075,465" /><rect fill="#12283e" height="270" rx="22" ry="22" stroke="#8ce5ae" stroke-width="2" width="407" x="1105" y="326" /><text fill="#8ce5ae" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" x="1139" y="380">03</text><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="37" font-weight="800" text-anchor="start" x="1139" y="439">DELIVERY</text><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start" x="1139" y="494">verified SHA + review</text><rect fill="#2b3d48" height=