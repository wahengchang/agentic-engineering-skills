<svg baseProfile="full" height="900px" version="1.1" viewBox="0 0 1600 900" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><pattern height="80" id="grid" patternUnits="userSpaceOnUse" width="80"><path d="M80 0 H0 V80" fill="none" stroke="#172b3c" stroke-width="1" /></pattern></defs><rect fill="#081423" height="900px" width="1600px" x="0" y="0" /><rect fill="url(#grid)" height="900" opacity="0.52" width="1600" x="0" y="0" /><line stroke="#55e1de" stroke-width="5" x1="80" x2="300" y1="85" y2="85" /><text fill="#55e1de" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4" text-anchor="start" x="80" y="65">PASEO ENGINEERING / FIELD NOTES</text><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start" x="80" y="165">The AI engineering staff</text><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start" x="80" y="220">A single coordinator advances each stage; product writes stay with one builder.</text><line stroke="#2c4b63" stroke-width="2" x1="80" x2="1520" y1="818" y2="818" /><text fill="#a5b8c9" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="1.2" text-anchor="start" x="80" y="855">CONCEPTUAL DIAGRAM  ·  NOT A PASEO PRODUCT SCREENSHOT</text><text fill="#55e1de" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" x="1490" y="855">04-roles-and-gates</text><rect fill="#133d53" height="98" rx="20" ry="20" stroke="#55e1de" stroke-width="2" width="675" x="460" y="285" /><text fill="#effbff" font-family="Inter, Noto Sans CJK TC, Noto Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="